<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta name="robots" content="noindex" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>WYXEN Hogwarts Roleplay</title>
    <script type="text/javascript">
      document.write(
        '<link rel="stylesheet" href="css/sleek.css?' + Math.random() + '">'
      );
    </script>
  </head>
  <body>
    <div id="video-container"></div>
    <div id="player"></div>
    <div id="overlay"></div>

    <main class="loading-screen" aria-label="WYXEN sunucu yükleme ekranı">
      <aside class="control-panel">
        <span class="corner corner-top-left"></span>
        <span class="corner corner-top-right"></span>
        <span class="corner corner-bottom-left"></span>
        <span class="corner corner-bottom-right"></span>

        <div class="panel-content">
          <header id="header" class="brand-block">
            <div id="title"></div>
            <div id="subtitle" data-lang="below_logo"></div>
            <div class="ornament" aria-hidden="true"><span></span><i>✦</i><span></span></div>
          </header>

          <section id="status-container" class="status-block" aria-label="Yükleme durumu">
            <div class="status-row">
              <span id="status-left" data-lang="loading"></span>
              <span id="status-right">0%</span>
            </div>
            <div id="loading" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="loading-progress"></div>
            </div>
          </section>

          <section class="server-card" aria-label="Sunucu bilgileri">
            <div class="server-detail">
              <span class="detail-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32"><path d="M16 3l10 4v8c0 7-4.2 11.4-10 14-5.8-2.6-10-7-10-14V7l10-4zM9 9v6c0 5.1 2.7 8.5 7 10.8 4.3-2.3 7-5.7 7-10.8V9l-7-2.8L9 9z"/><path d="M15 9h2v13h-2zM10.2 12.4l1.3-1.5 10.3 8.7-1.3 1.5zM20.5 10.9l1.3 1.5-10.3 8.7-1.3-1.5z"/></svg>
              </span>
              <span class="detail-copy">
                <small>SUNUCU</small>
                <strong id="server-name">Bağlantı bekleniyor</strong>
              </span>
            </div>
            <span class="detail-divider"></span>
            <div class="server-detail">
              <span class="detail-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32"><path d="M4 6l8-3 8 3 8-3v23l-8 3-8-3-8 3V6zm2 2v17.8l5-1.9V6.1L6 8zm7-1.9v17.8l6 2.2V8.2l-6-2.1zm8 2.1V26l5-1.9V6.3l-5 1.9z"/></svg>
              </span>
              <span class="detail-copy">
                <small>HARİTA</small>
                <strong id="map-name">—</strong>
              </span>
            </div>
          </section>

          <section class="message-block" aria-label="Baykuş notu">
            <div id="messages" class="owl-message" aria-live="polite"></div>
          </section>

          <section id="rules-section" class="rules-card" aria-label="Sunucu kuralları">
            <div class="section-title">TOPLULUK KURALLARI</div>
            <ul id="rules-list"></ul>
            <span class="crest-watermark" aria-hidden="true">W</span>
          </section>

          <nav id="social-links" class="social-links" aria-label="WYXEN bağlantıları"></nav>

          <div class="audio-hooks" aria-hidden="true">
            <div id="music">
              <span data-lang="now_playing"></span>
              <span id="music-name"></span>
            </div>
            <button id="enable-audio" type="button" tabindex="-1">Müziği etkinleştir</button>
          </div>
        </div>
      </aside>

      <section class="cinema-column" aria-label="WYXEN görsel arşivi">
        <div class="cinema-frame">
          <div id="cinema-backdrop" class="cinema-backdrop" aria-hidden="true"></div>
          <img id="cinema-image" class="cinema-image" alt="" />
          <div class="cinema-vignette" aria-hidden="true"></div>
          <div class="cinema-grain" aria-hidden="true"></div>
          <span class="cinema-corner cinema-corner-tl" aria-hidden="true"></span>
          <span class="cinema-corner cinema-corner-tr" aria-hidden="true"></span>
          <span class="cinema-corner cinema-corner-bl" aria-hidden="true"></span>
          <span class="cinema-corner cinema-corner-br" aria-hidden="true"></span>
        </div>

        <aside class="journey-panel" aria-label="Bağlantı günlüğü">
        <span class="journey-corner journey-corner-top"></span>
        <span class="journey-corner journey-corner-bottom"></span>

        <div class="journey-heading">
          <div>
            <small>BAĞLANTI GÜNLÜĞÜ</small>
            <span>WYXEN'E YOLCULUK</span>
          </div>
          <strong id="journey-percent">0%</strong>
        </div>

        <div class="journey-status-wrap">
          <span class="journey-pulse" aria-hidden="true"></span>
          <p id="journey-status" aria-live="polite">Sunucu durumu bekleniyor</p>
        </div>

        <ol id="journey-steps" class="journey-steps">
          <li data-step="0">
            <span class="step-marker">I</span>
            <span class="step-copy"><small>WORKSHOP</small><strong>İçerikler</strong></span>
          </li>
          <li data-step="1">
            <span class="step-marker">II</span>
            <span class="step-copy"><small>İSTEMCİ</small><strong>Oyun bilgileri</strong></span>
          </li>
          <li data-step="2">
            <span class="step-marker">III</span>
            <span class="step-copy"><small>LUA</small><strong>Sunucu kodu</strong></span>
          </li>
          <li data-step="3">
            <span class="step-marker">IV</span>
            <span class="step-copy"><small>HAZIR</small><strong>Oyuna giriş</strong></span>
          </li>
        </ol>

        <div class="journey-destination">
          <span class="destination-icon" aria-hidden="true">⌖</span>
          <span><small>HEDEF HARİTA</small><strong id="journey-map">—</strong></span>
        </div>
        </aside>

      </section>

    </main>

    <div id="error-box"></div>
    <div id="warn"></div>

    <script src="js/vendor/objectFitPolyfill.min.js"></script>
    <script src="js/vendor/jquery-2.1.1.min.js"></script>
    <script src="js/vendor/jquery.backstretch.min.js"></script>
    <script src="js/sleek.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
